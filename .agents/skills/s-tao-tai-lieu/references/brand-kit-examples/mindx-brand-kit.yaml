callout_overrides:            # MindX-specific callout color mapping
  goal: "E30613"              # 🎯 red
  insight: "FBEAF0"           # 💡 light pink bg with red border
  principle: "E30613"         # 🔑 red
  warning: "E30613"           # ⚠️ red (strong)
  critical: "B30410"          # 🚨 dark red
  reference: "003A5D"         # 📖 navy

content_hooks:                # Pre-fill defaults for MindX programs
  program_title_default: "MindX Agentic Workspace"
  field_default_values:
    organization: "MindX Technology School"

